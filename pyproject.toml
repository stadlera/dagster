[project]
name = "ingest"
version = "0.1.0"
description = "Dagster based ingestion of external finance datasets"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "fsspec>=2025.3",
    "sqlalchemy>=2.0",
    "exchange-calendars>=4.10",
]

[project.optional-dependencies]
sftp = ["paramiko>=3.5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.dagster]
module_name = "ingest.definitions"
project_name = "ingest"

[tool.pytest.ini_options]
testpaths = ["tests"]
