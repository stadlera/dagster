[project]
name = "ingest-tools"
version = "0.1.0"
description = "Discovery, profiling, and operator tools for ingest"
requires-python = ">=3.12"
dependencies = [
    "dlt>=1.10",
    "fsspec>=2025.3",
    "ingest",
    "numpy>=2",
    "pyarrow>=18",
    "sqlalchemy>=2.0",
]

[project.scripts]
ingest-discover = "ingest_tools.discover:main"
ingest-ops = "ingest_tools.ops:main"
ingest-profile = "ingest_tools.profile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_tools"]

[tool.uv.sources]
ingest = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]